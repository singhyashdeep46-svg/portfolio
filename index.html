<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Smart Kitchen Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ease:cubic-bezier(.23,1,.32,1);--drawer:cubic-bezier(.32,.72,0,1);
  --bg:#eef2dc;--page:#d9dec4;--ink:#2b2e2a;--ink2:#5c6257;--ac:#bf4521;--onac:#fff;--acsoft:rgba(232,204,214,.62);
  --ok:#3f6e3b;--line:rgba(46,49,46,.13);--glass:rgba(255,255,255,.56);--glassb:rgba(255,255,255,.78);
  --deep:rgba(46,49,46,.8);--sheetbg:rgba(249,251,239,.88);--sh:0 8px 24px rgba(46,49,46,.09);--field:rgba(255,255,255,.7);
  --b1:rgba(191,69,33,.30);--b2:rgba(232,204,214,.95);--b3:rgba(79,122,75,.30);--danger:#b3261e;
  --display:ui-rounded,'SF Pro Rounded',-apple-system,'Fredoka',system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,Roboto,sans-serif;
  --ts:1;
}
[data-theme=dark]{
  --bg:#121410;--page:#0a0b09;--ink:#f2f4ec;--ink2:#a9afa0;--ac:#ee7448;--onac:#1b0f0a;--acsoft:rgba(238,116,72,.2);
  --ok:#86b981;--line:rgba(255,255,255,.13);--glass:rgba(255,255,255,.075);--glassb:rgba(255,255,255,.15);
  --deep:rgba(255,255,255,.11);--sheetbg:rgba(30,33,28,.88);--sh:0 8px 24px rgba(0,0,0,.45);--field:rgba(255,255,255,.08);
  --b1:rgba(238,116,72,.2);--b2:rgba(150,70,100,.3);--b3:rgba(79,122,75,.24);--danger:#ff8a80;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--page)}
body{background:var(--page);font-family:var(--body);color:var(--ink);display:flex;justify-content:center;align-items:center;-webkit-font-smoothing:antialiased}
#phone{position:relative;width:100%;max-width:430px;height:100%;max-height:900px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;isolation:isolate}
@media(min-width:520px){#phone{border-radius:40px;box-shadow:0 24px 70px rgba(0,0,0,.28);height:min(900px,96vh)}}
#phone::before{content:"";position:absolute;inset:-15%;pointer-events:none;z-index:-1;
  background:radial-gradient(42% 30% at 12% 8%,var(--b1),transparent 70%),radial-gradient(40% 32% at 95% 30%,var(--b2),transparent 70%),
  radial-gradient(45% 30% at 8% 72%,var(--b3),transparent 70%),radial-gradient(40% 30% at 88% 92%,var(--b1),transparent 70%)}
#app{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:transparent;will-change:transform}
.screen.dark{background:#1b1d1a;color:#fff}
.a-push{animation:push 340ms var(--drawer)}
.a-pop{animation:pop 300ms var(--drawer)}
.a-fade{animation:fade 220ms var(--ease)}
@keyframes push{from{transform:translateX(100%)}to{transform:none}}
@keyframes pop{from{transform:translateX(-24%);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.edge{position:absolute;left:0;top:0;bottom:0;width:20px;z-index:30;touch-action:none}
.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-weight:600;font-size:16px;flex:none}
.status b{font-weight:800;font-size:12px;letter-spacing:.08em;margin-right:8px}
.status i{display:inline-block;width:22px;height:11px;border-radius:3.5px;background:currentColor;vertical-align:middle}
@media(max-width:519px){.status{display:none}.screen{padding-top:env(safe-area-inset-top)}.body{padding-top:14px!important}}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:8px 24px 20px;display:flex;flex-direction:column;gap:16px;min-height:0;zoom:var(--ts);scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.bottom{flex:none;padding:12px 24px max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.has-tabs .bottom{padding-bottom:10px}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.02em}
h1{font-size:32px;line-height:1.06}
h2{font-size:22px;line-height:1.15}
p.sub{font-size:16px;line-height:1.45;color:var(--ink2);letter-spacing:0}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.ac{color:var(--ac)}.soft{color:var(--ink2)}
.label{font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--ink2);padding:8px 4px 0;text-transform:uppercase}
.center{text-align:center}
button,a{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:left}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px;border-radius:12px}
.press{transition:transform 140ms var(--ease),opacity 140ms,background-color 200ms}
.press:active{transform:scale(.97)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:28px;padding:0 24px;font-weight:600;font-size:17px;text-align:center;width:100%}
.btn.p{background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 88%,#fff) 0%,var(--ac) 100%);color:var(--onac);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 10px 22px color-mix(in srgb,var(--ac) 32%,transparent)}
.btn.s{border:1.5px solid color-mix(in srgb,var(--ink) 55%,transparent);color:var(--ink);background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
.btn.d{border:1.5px solid var(--danger);color:var(--danger)}
.btn{flex:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{color:var(--ac);font-weight:700;font-size:16px;text-align:center;padding:10px;align-self:center;min-height:44px}
.row{display:flex;gap:12px;align-items:center}
.card{background:var(--glass);border:1px solid var(--glassb);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),var(--sh);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
.icon-btn{width:44px;height:44px;border-radius:22px;background:var(--glass);border:1px solid var(--glassb);display:flex;align-items:center;justify-content:center;flex:none;font-size:20px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
svg.i{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
.hdr{display:flex;gap:12px;align-items:center;min-height:48px;flex:none}
.hdr h2{flex:1}
.qi{width:40px;height:40px;border-radius:20px;background:var(--acsoft);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));color:var(--onac);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 36px color-mix(in srgb,var(--ac) 35%,transparent)}
.logo.big{width:104px;height:104px;border-radius:32px;font-size:52px}
.center-col{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.wm{font-size:34px}
.splash .logo{animation:pop-in 520ms var(--ease) both}
.splash .wm,.splash .sub{animation:fade 600ms 160ms var(--ease) both}
@keyframes pop-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.feats{display:flex;flex-direction:column;gap:12px}
.feat{display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--glass);border:1px solid var(--glassb);border-radius:20px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);animation:rise 420ms var(--ease) both;animation-delay:calc(var(--i)*60ms + 100ms)}
.feat b{display:block;font-size:16px}.feat span{font-size:14px;color:var(--ink2);line-height:1.35}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero-h{font-size:36px}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:13px;color:var(--ink2);padding-left:4px}
.inp{display:flex;align-items:center;gap:10px;height:56px;padding:0 6px 0 16px;border-radius:18px;background:var(--field);border:1.5px solid var(--glassb);transition:border-color 160ms,box-shadow 160ms;color:var(--ink2);font-size:20px}
.inp:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.inp.bad{border-color:var(--danger)}
.inp input{flex:1;min-width:0;height:100%;border:0;background:none;outline:0;font:inherit;font-size:17px;color:var(--ink);padding-right:8px}
.inp input::placeholder{color:var(--ink2);opacity:.7}
.eye{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink2)}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:0;padding-left:4px}
.shake{animation:shake 260ms var(--ease)}
@keyframes shake{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
.meter{display:flex;gap:6px;align-items:center;padding:2px 4px}
.meter i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:background-color 200ms}
.meter i.on{background:var(--ac)}.meter small{font-weight:700;font-size:12px;color:var(--ink2);min-width:46px;text-align:right}
.note{font-size:13px;line-height:1.4;color:var(--ink2);text-align:center}
.divider{display:flex;align-items:center;gap:12px;color:var(--ink2);font-size:13px;font-weight:600}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
/* controls */
.seg{display:flex;padding:3px;border-radius:16px;background:var(--glass);border:1px solid var(--glassb);gap:2px}
.seg button{flex:1;height:40px;border-radius:13px;font-weight:700;font-size:14px;text-align:center;color:var(--ink2);transition:background-color 200ms var(--ease),color 200ms,transform 140ms var(--ease)}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--ac);color:var(--onac)}
.sw{position:relative;width:52px;height:32px;border-radius:16px;background:var(--line);flex:none;transition:background-color 220ms var(--ease)}
.sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:13px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform 260ms var(--drawer)}
.sw[aria-checked=true]{background:var(--ok)}.sw[aria-checked=true] i{transform:translateX(20px)}
.sw:active i{width:30px}.sw[aria-checked=true]:active i{transform:translateX(16px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:none;outline:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:14px;background:#fff;margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:transform 140ms var(--ease)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.rng-lab{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink2);padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glassb);border-radius:18px;padding:0 16px;min-height:40px;font-weight:600;font-size:14px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:background-color 200ms,color 200ms,transform 140ms var(--ease)}
.chip.on{background:var(--ac);color:var(--onac);border-color:transparent}
.chip:active{transform:scale(.97)}
.tag{display:inline-block;background:var(--ac);color:var(--onac);font-weight:800;font-size:11px;letter-spacing:.08em;padding:4px 10px;border-radius:12px}
.tag.warn{background:transparent;color:var(--ac);border:1.5px solid var(--ac)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:0 18px;border-radius:20px;background:var(--glass);border:1.5px solid var(--glassb);font-weight:600;font-size:17px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:border-color 200ms,background-color 200ms,transform 140ms var(--ease)}
.opt span{flex:1}.opt svg{opacity:0;color:var(--ac);font-size:22px;transition:opacity 160ms}
.opt:active{transform:scale(.98)}
.opt.on{border-color:var(--ac);background:var(--acsoft)}.opt.on svg{opacity:1}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 12px 10px 18px}
.stepper b{font-family:var(--display);font-size:28px;min-width:40px;text-align:center}
.stepper .row{gap:8px}
.pbar{display:flex;gap:6px;flex:1}.pbar i{flex:1;height:5px;border-radius:3px;background:var(--line);transition:background-color 300ms var(--ease)}.pbar i.on{background:var(--ac)}
.warn-card{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--acsoft);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);border-radius:20px}
.warn-card svg{font-size:22px;color:var(--ac);margin-top:1px}
.warn-card b{display:block;font-size:15px}.warn-card p{font-size:14px;line-height:1.4;color:var(--ink);margin-top:2px}
.perm{display:flex;gap:14px;align-items:center;padding:16px}
.perm b{display:block;font-size:17px}.perm span{display:block;font-size:14px;line-height:1.4;color:var(--ink2);margin-top:2px}
.pbtn{height:40px;padding:0 18px;border-radius:20px;background:var(--ac);color:var(--onac);font-weight:700;font-size:14px;flex:none}
.pbtn.ok{background:var(--acsoft);color:var(--ok)}.pbtn.no{background:transparent;border:1.5px solid var(--danger);color:var(--danger)}
/* lists */
.group{display:flex;flex-direction:column;padding:0 4px}
.lrow{display:flex;align-items:center;gap:14px;min-height:60px;padding:8px 14px;width:100%;border-bottom:1px solid var(--line);transition:background-color 160ms}
.lrow:last-child{border:0}
.lrow>div{flex:1;min-width:0}.lrow>.qi{flex:none;width:40px}.lrow b{display:block;font-size:16px;font-weight:600}.lrow small{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.lrow .val{flex:none;font-size:14px;color:var(--ink2);font-weight:600}
.lrow>svg:last-child.chev{color:var(--ink2);font-size:16px;opacity:.7}
.lrow.dng b{color:var(--danger)}
.lrow:active{background:var(--acsoft)}
.setcard{padding:16px;display:flex;flex-direction:column;gap:12px}
.setcard .top{display:flex;align-items:baseline;justify-content:space-between}
.setcard .top b{font-size:16px}.setcard .top em{font-style:normal;font-weight:700;color:var(--ac);font-size:15px;font-variant-numeric:tabular-nums}
/* tab bar */
.tabbar{flex:none;margin:0 16px max(12px,env(safe-area-inset-bottom));height:66px;border-radius:33px;display:flex;padding:6px;gap:4px;background:var(--glass);border:1px solid var(--glassb);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),var(--sh);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%)}
.tab{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:27px;font-size:22px;color:var(--ink2);transition:background-color 200ms var(--ease),color 200ms,transform 140ms var(--ease)}
.tab span{font-size:11px;font-weight:700;letter-spacing:.02em}
.tab.on{background:var(--acsoft);color:var(--ac)}
.dot{position:absolute;top:6px;right:22%;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:var(--onac);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* home */
.greet{display:flex;justify-content:space-between;align-items:center}
.greet h1{margin-top:4px}
.avatar{width:46px;height:46px;border-radius:23px;background:var(--acsoft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ac);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.avatar.lg{width:72px;height:72px;border-radius:36px;font-size:26px}
.pill-timer{background:var(--acsoft);border:1px solid var(--glassb);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;font-weight:600;font-size:15px;width:100%;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.pill-timer svg{font-size:20px;color:var(--ac)}
.voice-card,.bar,.now{background:var(--deep);color:#fff;border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 34px rgba(0,0,0,.25);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%)}
.voice-card{border-radius:28px;padding:16px 20px;display:flex;gap:16px;align-items:center;width:100%}
.voice-card .eyebrow{color:var(--acsoft);filter:brightness(1.6)}
.voice-card h3{font-size:22px;line-height:26px;margin:8px 0}
.voice-card small{opacity:.8;font-weight:600;font-size:13px}
.mic-ring{width:88px;height:88px;border-radius:44px;border:3px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;flex:none}
.mic-orb{width:68px;height:68px;border-radius:34px;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;font-size:30px}
.mic-ring.live .mic-orb{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.5)}50%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.quick{display:flex;gap:12px}
.quick>button{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
.quick b{font-size:16px;display:block}.quick span{font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--ink2)}
.recipe{display:flex;gap:16px;align-items:center;padding:12px;width:100%}
.recipe .ph{width:72px;height:72px;border-radius:16px;background:var(--acsoft);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none;background-size:cover;background-position:center}
.recipe .ph.photo svg{display:none}
.recipe b{font-size:17px;display:block}.recipe small{font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--ink2);display:block;margin:6px 0}
.recipe .tags{display:flex;gap:6px;flex-wrap:wrap}
.bar{border-radius:32px;height:64px;display:flex;align-items:center;gap:12px;padding:0 20px 0 8px;width:100%}
.bar .orb{width:48px;height:48px;border-radius:24px;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.bar p{flex:1;font-weight:600;font-size:15px;line-height:22px;min-width:0}
.wave{display:flex;gap:4px;align-items:center;height:28px}
.wave span{width:3px;border-radius:2px;background:rgba(255,255,255,.7);height:10px}
.wave.live span{animation:wv .9s ease-in-out infinite}
.wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}.wave span:nth-child(5){animation-delay:.4s}
@keyframes wv{0%,100%{height:8px}50%{height:26px}}
/* scan */
.cam{position:relative;min-height:300px;border-radius:28px;overflow:hidden;background:#000;border:2px solid rgba(255,255,255,.22);flex:1}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam video.rear{transform:none}
.boxes{position:absolute;inset:0}
.det{position:absolute;border:2px dashed #fff;border-radius:12px;transition:all .25s}
.det span{position:absolute;left:-2px;bottom:100%;margin-bottom:2px;background:#fff;color:#2b2e2a;font-weight:800;font-size:12px;letter-spacing:.08em;padding:4px 8px;border-radius:8px;white-space:nowrap}
.status-pill{position:absolute;left:14px;top:14px;background:rgba(26,28,26,.7);color:#fff;font-weight:600;font-size:13px;padding:8px 12px;border-radius:14px;max-width:90%;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nocam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:#fff}
.nocam p{font-size:14px;line-height:1.4;opacity:.8}
.nocam .btn{height:44px;font-size:15px;width:auto}
.ctrls{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 8px 0}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;min-width:62px;text-align:center}
.cbtn i{width:56px;height:56px;border-radius:28px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:24px;font-style:normal;transition:background-color 200ms}
.cbtn.act i{background:var(--ac);color:var(--onac)}
.shutter{width:84px;height:84px;border-radius:42px;border:4px solid #fff;padding:6px}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform 140ms var(--ease)}
.shutter:active i{transform:scale(.88)}
.dark .icon-btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.22);color:#fff}
/* recipe detail */
.hero{position:relative;height:150px;border-radius:26px;background:var(--acsoft);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:56px;flex:none;overflow:hidden;border:1px solid var(--glassb);background-size:cover;background-position:center;box-shadow:var(--sh)}
.hero.photo>svg{display:none}
.addphoto{position:absolute;right:10px;bottom:10px;display:flex;gap:6px;align-items:center;height:38px;padding:0 14px;border-radius:19px;color:var(--ink);font-weight:700;font-size:13px;background:rgba(255,255,255,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.8)}
.addphoto svg{display:block!important;font-size:16px}
.rtitle{font-size:28px;line-height:1.12}
.ing{padding:4px 16px;list-style:none}
.ing li{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:16px}
.ing li:last-child{border:0}
.ing li span{flex:1}.ing li em{font-style:normal;font-size:13px;color:var(--ink2)}
.ing li svg{color:var(--ok);font-size:18px}
.ing li.miss{color:var(--ac)}.ing li.miss svg,.ing li.miss em{color:var(--ac);font-weight:700;letter-spacing:.04em}
.ing li.chg em{color:var(--ac);font-weight:700}
/* adapt */
.orb-wrap{height:170px;position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.orb-wrap i{position:absolute;border-radius:50%;background:var(--acsoft)}
.orb-wrap .r3{width:168px;height:168px;opacity:.5}.orb-wrap .r2{width:130px;height:130px;opacity:.8}
.orb-wrap .o{width:92px;height:92px;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center;font-size:38px;font-style:normal}
.orb-wrap.live .r3{animation:rg 1.6s infinite}.orb-wrap.live .r2{animation:rg 1.6s .3s infinite}
@keyframes rg{50%{transform:scale(1.1)}}
.said{padding:16px}.said p{font-weight:600;font-size:18px;line-height:26px;margin-top:8px;min-height:26px}
.resp{background:var(--acsoft);border:1px solid var(--glassb);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.resp .head{display:flex;gap:8px;align-items:center}.resp .head svg{color:var(--ac);font-size:18px}
.chgl{display:flex;gap:12px;font-weight:600;font-size:15px;line-height:22px}.chgl svg{color:var(--ok);margin-top:2px;font-size:18px}
/* cooking */
.top{display:flex;gap:12px;align-items:center;flex:none}
.top .t{flex:1;font-weight:800;font-size:12px;letter-spacing:.08em;color:var(--ink2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{background:var(--acsoft);border:1px solid var(--glassb);border-radius:18px;padding:0 14px;min-height:44px;display:flex;gap:8px;align-items:center;font-weight:800;font-size:12px;letter-spacing:.08em;transition:background-color 200ms,color 200ms}
.hint.live{background:var(--ac);color:var(--onac)}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.track>div{height:100%;background:var(--ac);border-radius:4px;transition:width 400ms var(--drawer)}
.now{border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:12px}
.now .eyebrow{opacity:.75}.now h2{font-size:28px;line-height:34px}.now p{font-size:16px;line-height:23px;opacity:.85}
.cue{display:flex;gap:12px;align-items:center;padding:16px}
.cue .ph{width:60px;height:60px;border-radius:16px;background:var(--acsoft);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.cue .eyebrow{color:var(--ink2)}.cue p{font-weight:600;font-size:15px;line-height:22px;margin-top:4px}
.timer-card{background:var(--acsoft);border:1px solid var(--glassb);border-radius:20px;padding:16px;display:flex;gap:12px;align-items:center;width:100%}
.timer-card svg{font-size:26px;color:var(--ac)}
.timer-card b{font-family:var(--display);font-size:30px;font-weight:600;display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.timer-card small{font-weight:600;font-size:13px;color:var(--ink2)}
.pip{position:relative;width:88px;height:88px;border-radius:22px;overflow:hidden;background:var(--acsoft);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ac);font-size:40px}
.pip video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.gfb{display:flex;gap:16px;align-items:center;padding:14px}
.gfb .eyebrow{color:var(--ac)}.gfb h3{font-size:19px;line-height:1.25;margin:4px 0}.gfb small{font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--ink2)}
/* tasks */
.alert{background:color-mix(in srgb,var(--ac) 88%,transparent);color:var(--onac);border-radius:22px;padding:16px;display:flex;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.3);animation:rise 320ms var(--ease)}
.alert .bell{width:44px;height:44px;border-radius:22px;background:#fff;color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.alert p{font-weight:700;font-size:17px;line-height:25px}
.task{padding:16px;display:flex;gap:12px;align-items:center}
.task .st{width:44px;height:44px;border-radius:22px;background:var(--acsoft);color:var(--ac);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.task.done .st{background:var(--ok);color:#fff}
.task .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}.task b{font-size:16px}
.task .tr{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.task .tr>div{height:100%;background:var(--ac)}.task.done .tr>div{background:var(--ok)}
.task small{font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--ink2)}
.task .tm{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}.task.done .tm{color:var(--ok)}
.task .x{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:22px;color:var(--ink2)}
/* done */
.ok{width:120px;height:120px;border-radius:60px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;margin:40px auto 0;animation:pop-in 500ms var(--ease)}
.stats{display:flex;gap:12px}.stats>div{flex:1;padding:16px 8px;text-align:center}.stats b{display:block;font-family:var(--display);font-size:22px;font-weight:600}.stats small{font-weight:800;font-size:11px;letter-spacing:.08em;color:var(--ink2)}
.stars{display:flex;gap:6px;justify-content:center}.stars button{font-size:30px;color:var(--ink2);padding:6px;min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center}.stars button.on{color:var(--ac)}
/* gesture lab */
.gview{position:relative;height:230px;border-radius:26px;overflow:hidden;background:#000;flex:none;border:1px solid var(--glassb)}
.gview video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.gtoast{position:absolute;left:50%;bottom:14px;transform:translate(-50%,8px) scale(.95);opacity:0;background:var(--ac);color:var(--onac);font-weight:800;font-size:14px;padding:10px 16px;border-radius:20px;white-space:nowrap;transition:opacity 160ms var(--ease),transform 260ms var(--drawer)}
.gtoast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.mtr{display:flex;flex-direction:column;gap:6px}
.mtr .l{display:flex;justify-content:space-between;font-weight:700;font-size:13px}.mtr .l span:last-child{color:var(--ink2);font-weight:600}
.mtr .b{position:relative;height:10px;border-radius:5px;background:var(--line)}
.mtr .b>i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink2);width:0;transition:width 90ms linear,background-color 120ms}
.mtr .b>i.hit{background:var(--ac)}
.mtr .b>u{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ac);transition:left 200ms var(--ease)}
.glog{display:flex;flex-direction:column;gap:6px;min-height:20px;font-size:14px;font-weight:600}
.glog div{display:flex;justify-content:space-between;animation:rise 240ms var(--ease)}.glog small{color:var(--ink2);font-weight:600}
/* sheet */
#sheet{position:absolute;inset:0;z-index:40;pointer-events:none}
#sheet.on{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;transition:opacity 300ms var(--ease)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;border-radius:30px 30px 0 0;padding:8px 24px max(24px,env(safe-area-inset-bottom));background:var(--sheetbg);border-top:1px solid var(--glassb);box-shadow:0 -10px 40px rgba(0,0,0,.2);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);display:flex;flex-direction:column;gap:16px;touch-action:pan-y}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center;margin:4px 0 6px;flex:none}
.panel h2{font-size:24px}

#cap.on{display:block;animation:rise 200ms var(--ease)}
#cap small{display:block;opacity:.7;font-weight:800;font-size:11px;letter-spacing:.08em;margin-bottom:2px}

.slides{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;min-height:0}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 32px;text-align:center}
.art{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.art i{position:absolute;border-radius:50%;background:var(--acsoft)}
.art .a3{width:230px;height:230px;opacity:.45;animation:breathe 3.4s ease-in-out infinite}
.art .a2{width:168px;height:168px;opacity:.85;animation:breathe 3.4s .4s ease-in-out infinite}
.art .a1{width:112px;height:112px;background:linear-gradient(160deg,color-mix(in srgb,var(--ac) 80%,#fff),var(--ac));color:var(--onac);display:flex;align-items:center;justify-content:center;font-size:50px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 16px 36px color-mix(in srgb,var(--ac) 35%,transparent)}
@keyframes breathe{50%{transform:scale(1.06)}}
.dots{display:flex;gap:8px;justify-content:center;padding-bottom:4px}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width 260ms var(--drawer),background-color 200ms}
.dots i.on{width:26px;background:var(--ac)}
.loadbar{width:120px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:10px}
.loadbar i{display:block;height:100%;width:100%;background:var(--ac);transform-origin:left;animation:loadbar 1.5s var(--ease) forwards}
@keyframes loadbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.pant{display:flex;flex-direction:column;gap:10px}
.prow{display:flex;align-items:center;gap:14px;min-height:64px;padding:8px 16px;border-radius:20px;background:var(--glass);border:1.5px solid var(--glassb);width:100%;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);transition:border-color 200ms,background-color 200ms,transform 140ms var(--ease)}
.prow .ck{width:30px;height:30px;border-radius:15px;border:2px solid var(--ink2);display:flex;align-items:center;justify-content:center;color:transparent;font-size:18px;flex:none;transition:background-color 200ms var(--ease),border-color 200ms,color 200ms}
.prow.on{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,var(--glass))}
.prow.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.prow b{display:block;font-size:17px}.prow small{font-size:13px;color:var(--ink2)}
.prow em{font-style:normal;font-size:12px;font-weight:800;letter-spacing:.08em;color:var(--ink2)}
.prow.on em{color:var(--ok)}.prow.miss em{color:var(--ac)}
.warn-card.good{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.warn-card.good svg{color:var(--ok)}
.vr{padding:0 12px 0 0}
.vsel{flex:1;display:flex;align-items:center;gap:10px;min-height:60px;padding:8px 14px;text-align:left;min-width:0}
.vsel>div{flex:1;min-width:0}.vsel b{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.vsel small{display:block;font-size:13px;color:var(--ink2)}.vsel svg{color:var(--ac);font-size:20px}
.gview canvas{position:absolute;inset:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
.gview .badge{position:absolute;left:12px;top:12px;background:rgba(26,28,26,.7);color:#fff;font-weight:700;font-size:12px;padding:7px 12px;border-radius:14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nocam svg{font-size:40px}
.nocam b{font-size:17px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(hover:hover) and (pointer:fine){.lrow:hover{background:var(--acsoft)}.chip:not(.on):hover,.opt:not(.on):hover{background:var(--glassb)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
[data-motion=on] *,[data-motion=on] *::before,[data-motion=on] *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}

@media(prefers-contrast:more){.card,.chip,.opt,.icon-btn,.inp{border-color:var(--ink)}}

  <div class="orb-wrap ${recOn?'live':''}"><i class="r3"></i><i class="r2"></i><i class="o">${ic('mic')}</i></div>
  <div class="eyebrow center ac">${recOn?'LISTENING…':'TAP BELOW TO SPEAK'}</div>
  <div class="card said"><div class="eyebrow soft">YOU SAID</div><p id="heard">${a.said?'“'+esc(a.said)+'”':'Try “Make it less spicy”'}</p></div>
  ${a.ch.length?`<div class="resp"><div class="head">${ic('sparkle')}<span class="eyebrow">CHEF AI · RECIPE ADAPTED</span></div>${a.ch.map(c=>`<div class="chgl">${ic('check')}<span>${esc(c)}</span></div>`).join('')}</div>`:''}</div>
  <div class="bottom"><button class="btn s press" data-act="talk">${ic('mic')} Speak</button><button class="btn p press" data-act="apply" ${a.ch.length?'':'disabled'}>Apply &amp; start cooking</button></div>`};
VIEWS.cook=()=>{const r=R(),s=r.steps[S.step],pct=((S.step+1)/r.steps.length)*100,tm=s.timer&&S.timers.find(t=>t.name===s.timer[0]);
  const left=tm&&!tm.fired?(tm.end-Date.now())/1000:(s.timer?s.timer[1]:0);
  return `${status()}<div class="body"><div class="top"><button class="icon-btn press" data-act="exitcook" aria-label="Close">${ic('x')}</button><span class="t">${esc(r.title.toUpperCase())}</span>
   <button class="hint press ${S.gestures?'live':''}" data-act="gest" aria-pressed="${S.gestures}">${ic('hand')}<span>${S.gestures?'GESTURE ON':'WAVE = NEXT'}</span></button></div>
   ${S.gestures?`<div class="card gfb"><div class="pip"><video id="pipv" data-live playsinline muted autoplay></video>${ic('hand')}</div><div style="min-width:0"><div class="eyebrow" id="gh">GETTING READY</div><h3 id="gtxt">Starting camera…</h3><small id="gsub">WAVE · PALM · THUMBS UP</small></div></div>`:''}
   <div><div class="eyebrow soft" style="margin-bottom:8px">STEP ${S.step+1} OF ${r.steps.length}</div><div class="track"><div style="width:${pct}%"></div></div></div>
   <div class="now"><div class="eyebrow">NOW</div><h2>${esc(s.t)}</h2><p>${esc(s.d)}</p></div>
   <div class="card cue"><div class="ph">${ic('chef')}</div><div><div class="eyebrow">LOOK FOR</div><p>${esc(s.cue)}</p></div></div>
   ${s.timer?`<button class="timer-card press" data-act="steptimer">${ic('timer')}<div style="flex:1"><b data-bind="steptime">${fmt(left)}</b><small>${tm&&!tm.fired?esc(s.timer[2]):'Say “Start timer”'}</small></div>${ic('chev')}</button>`:''}
   <div class="chips">${['Next','Repeat','Swap ingredient'].map(c=>`<button class="chip press" data-say="${c.toLowerCase()}">“${c}”</button>`).join('')}<button class="chip press" data-act="gestquick">${ic('sliders')} Gesture sensitivity</button></div></div>
  <div class="bottom">${hfBar(recOn)}<div class="row"><button class="btn s press" data-act="prev" style="width:110px;flex:none;padding:0">Back</button><button class="btn p press" data-act="next" style="flex:1">${S.step>=r.steps.length-1?'Finish':'Next step'}</button></div></div>`};
VIEWS.done=()=>`${status()}<div class="body" style="align-items:stretch">
  <div class="ok">${ic('check')}</div><h1 class="center" style="font-size:34px;margin-top:8px">Dinner is ready!</h1>
  <p class="center sub" style="padding:0 20px;font-weight:600">${esc(R().title)} · cooked hands-free in ${S.took||28} min</p>
  <div class="stats"><div class="card"><b>${S.took||28} min</b><small>TIME</small></div><div class="card"><b>${R().steps.length} / ${R().steps.length}</b><small>STEPS</small></div><div class="card"><b>${S.cmds}</b><small>VOICE CMDS</small></div></div>
  <div class="card" style="padding:12px 16px"><div class="row" style="justify-content:center;gap:8px;font-weight:600;font-size:16px;padding:4px 0 6px">${ic('mic')}<span>Say “Rate it 5 stars” or tap</span></div><div class="stars">${[1,2,3,4,5].map(n=>`<button class="${n<=S.rating?'on':''}" data-rate="${n}" aria-label="${n} star${n>1?'s':''}">${ic('star')}</button>`).join('')}</div></div></div>
  <div class="bottom"><button class="btn p press" data-go="home">Cook something else</button></div>`;

function render(anim='fade'){
  const v=VIEWS[S.screen]();const dark=S.screen==='scan',tabs=TABS.includes(S.screen);
  app.innerHTML=`<section class="screen on ${dark?'dark':''} ${tabs?'has-tabs':''} a-${anim}" data-screen="${S.screen}">${v}${S.stack.length>1&&!['ready','perms','pz'].includes(S.screen)?'<i class="edge" aria-hidden="true"></i>':''}</section>`;
  $$('.stars svg').forEach(s=>{const on=s.closest('button').classList.contains('on');s.style.fill=on?'currentColor':'none';s.style.stroke='currentColor';s.style.strokeWidth=on?'0':'1.8'});
  $$('video[data-live]').forEach(vd=>{if(S.stream){vd.srcObject=S.stream;vd.classList.toggle('rear',!!S.rear);vd.play().catch(()=>{})}});
  if(S.screen==='gesture'){updateTicks();labStatus()}
  if(S.screen==='cook'&&S.gestures)pipIdle();
  if(S.screen==='signup')$('#name')&&$('#name').focus({preventScroll:true});
}

/* =============== auth logic =============== */
const VAL={email:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?'':'Enter a valid email address',pass:v=>v.length>=8?'':'Use at least 8 characters',name:v=>v.trim()?'':'Add your name'};
function validate(inp,quiet){const k=inp.dataset.v;if(!k)return true;const m=VAL[k](inp.value),w=$('#w-'+inp.id),e=$('#e-'+inp.id);if(w)w.classList.toggle('bad',!!m);if(e)e.textContent=m;inp.setAttribute('aria-invalid',!!m);return !m}
document.addEventListener('focusout',e=>{if(e.target.matches&&e.target.matches('input[data-v]')&&e.target.value)validate(e.target)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('input[data-v]')&&t.closest('.inp').classList.contains('bad'))validate(t);
  if(t.id==='pass'&&S.screen==='signup'){const v=t.value;const sc=(v.length>=8)+(/[a-z]/.test(v)&&/[A-Z]/.test(v))+(/\d/.test(v)||/[^\w\s]/.test(v));$$('.meter i').forEach((i,k)=>i.classList.toggle('on',v&&k<Math.max(1,sc)));$('#pwl').textContent=v?['Weak','Weak','OK','Strong'][sc]:''}
  if(t.dataset.range){
    const path=t.dataset.range,v=+t.value,min=+t.min,max=+t.max;t.style.setProperty('--p',(v-min)/(max-min)*100+'%');sp(path,v);
    const o=$(`[data-out="${path}"]`);if(o)o.textContent=FMT[path]?FMT[path](v):SPICE[v];
    if(path==='spice'){const c=$('#chiliOut');if(c)c.textContent=CHILI[v]}
    if(path==='gest.sens'&&t.closest('.panel')){const o2=$('.panel [data-out]');if(o2)o2.textContent=FMT[path](v)}
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;if(f.id!=='loginForm'&&f.id!=='signupForm')return;
  const inputs=$$('input[data-v]',f),bad=inputs.filter(i=>!validate(i));
  if(bad.length){const b=$('button[type=submit]',f);b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');bad[0].focus();buzz(40);return}
  const email=$('#email',f).value.trim(),nameEl=$('#name',f);
  const prev=ls.get(KEYS.user,null);
  /* TODO: replace with real authentication. This prototype never stores passwords. */
  S.user={name:nameEl?nameEl.value.trim():(prev&&prev.email===email&&prev.name)||email.split('@')[0].replace(/[._]/g,' ').replace(/^./,c=>c.toUpperCase()),email};
  ls.set(KEYS.user,S.user);ls.set(KEYS.last,email);P.done?reset('home'):reset('perms');
});
async function reqPerm(kind){
  try{const st=await navigator.mediaDevices.getUserMedia(kind==='mic'?{audio:true}:{video:true});st.getTracks().forEach(t=>t.stop());S.perm[kind]='ok'}catch(e){S.perm[kind]='no'}
  if(S.screen==='perms')rr();
}
function forgotSheet(){
  sheet(`<h2>Reset password</h2><p class="sub">Enter your email and we’ll send a reset link.</p><form id="forgotForm" novalidate style="display:flex;flex-direction:column;gap:14px">${fld({id:'femail',label:'Email',icon:'mail',type:'email',ac:'email',im:'email',ph:'you@example.com',v2:'email'})}<button class="btn p press" type="submit">Send link</button></form>`);
}
document.addEventListener('submit',e=>{
  if(e.target.id!=='forgotForm')return;e.preventDefault();const i=$('#femail');if(!validate(i)){i.focus();return}
  $('.panel').innerHTML=`<div class="grab"></div><div class="center-col" style="padding:8px 0 4px"><div class="ok" style="margin:0;width:84px;height:84px;font-size:40px">${ic('check')}</div><h2>Check your inbox</h2><p class="sub">Demo only: this prototype has no email service, so nothing was actually sent.</p></div><button class="btn p press" data-act="sheetclose">Done</button>`;
});
function gestSheet(){
  sheet(`<h2>Gesture sensitivity</h2><div class="card setcard"><div class="top"><b>Sensitivity</b><em data-out="gest.sens">${FMT['gest.sens'](P.gest.sens)}</em></div>${range('gest.sens',0,100,1)}<div class="rng-lab"><span>Fewer false triggers</span><span>Catches subtle moves</span></div></div><p class="note">Changes apply instantly to the camera above.</p><button class="btn s press" data-act="gestfull">More gesture settings</button>`);
}

function introDone(){P.intro=true;savePrefs();reset(S.user?(P.done?'home':'perms'):'welcome')}
function restartAll(full){
  stopRec();stopStream();try{speechSynthesis.cancel()}catch(e){}
  if(full){Object.values(KEYS).forEach(ls.del);PH={};stats.cooked=0;stats.mins=0}else ls.del(KEYS.user);
  P=clone(DEF);if(!full)ls.set(KEYS.prefs,P);
  Object.assign(S,{user:null,adapt:null,ovr:{},timers:[],alert:null,gestures:false,handsfree:false,scanGesture:false,glog:[],pz:0,pzEdit:false,perm:{mic:'idle',cam:'idle'},startedAt:null,rating:0,rid:'pasta',step:0,vf:'en'});
  S.found.clear();applyUI();reset('splash');
}
document.addEventListener('scroll',e=>{const t=e.target;if(!t||t.id!=='slides')return;const i=Math.round(t.scrollLeft/t.clientWidth);$$('#dots i').forEach((d,k)=>d.classList.toggle('on',k===i));const b=$('#introbtn');if(b)b.textContent=i>=INTRO.length-1?'Get started':'Next'},true);
/* =============== events =============== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-recipe],[data-say],[data-add],[data-rm],[data-rate],[data-canceltid],[data-set],[data-multi],[data-sw],[data-step],[data-voice],[data-pant],[data-vf],[data-vpreset],[data-vplay]');if(!t||!phone.contains(t))return;
  const d=t.dataset;
  if(d.go){if(S.sheetOpen)closeSheet(true);return go(d.go)}
  if(d.recipe){openRecipe(d.recipe);say(`${R().title}. Let’s check what you have.`);return}
  if(d.say){S.cmds++;command(d.say);return}
  if(d.add){S.found.add(d.add);rr();return}
  if(d.rm){S.found.delete(d.rm);rr();return}
  if(d.rate){rate(+d.rate);return}
  if(d.canceltid){S.timers=S.timers.filter(x=>String(x.id)!==d.canceltid);rr();return}
  if(d.set!==undefined){
    const raw=d.val,val=/^-?\d+(\.\d+)?$/.test(raw)?+raw:raw;sp(d.set,val);
    const grp=t.closest('.seg,.opts');if(grp)$$('[data-set]',grp).forEach(b=>{const on=b===t;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});
    if(d.set==='ui.text'||d.set==='ui.theme')return;if(d.set==='gest.hold')updateTicks();return}
  if(d.multi){const a=P[d.multi],v=d.val,i=a.indexOf(v);i<0?a.push(v):a.splice(i,1);savePrefs();t.classList.toggle('on',i<0);t.setAttribute('aria-pressed',i<0);return}
  if(d.sw){const v=!gp(d.sw);sp(d.sw,v);t.setAttribute('aria-checked',v);buzz(10);if(d.sw==='voice.wake'||d.sw==='gest.on')savePrefs();return}
  if(d.step){const[k,n]=d.step.split(':');P[k]=Math.max(1,Math.min(8,P[k]+ +n));savePrefs();const h=$('#hh');if(h)h.textContent=P[k];return}
  if(d.pant){S.found.has(d.pant)?S.found.delete(d.pant):S.found.add(d.pant);buzz(10);pantryUpdate();return}
  if(d.vf){S.vf=d.vf;rr();return}
  if(d.vpreset){const p=VPRESETS[d.vpreset];P.voice.pitch=p[0];P.voice.rate=p[1];P.voice.preset=d.vpreset;savePrefs();rr();speak(VOICE_SAMPLE);return}
  if(d.vplay!==undefined){speak(VOICE_SAMPLE,d.vplay);return}
  if(d.voice!==undefined){sp('voice.voiceName',d.voice);rr();speak(VOICE_SAMPLE,d.voice);return}
  const a=d.act;
  switch(a){
   case'back':return back();
   case'introskip':return introDone();
   case'intronext':{const sl=$('#slides');if(!sl)return;const i=Math.round(sl.scrollLeft/sl.clientWidth);if(i>=INTRO.length-1)return introDone();sl.scrollTo({left:(i+1)*sl.clientWidth,behavior:'smooth'});return}
   case'pantryall':R().ing.forEach(i=>S.found.add(i[2]));pantryUpdate();return;
   case'pantrynone':R().ing.forEach(i=>S.found.delete(i[2]));pantryUpdate();return;
   case'pantryscan':S.scanFrom='pantry';return go('scan');
   case'pantrynext':return pantryNext();
   case'scanphoto':{const f=$('#scanin');f.value='';f.click();return}
   case'labretry':return startLab();
   case'reloadhands':HANDS=null;return resumeCam();
   case'reloadvoices':{pickVoice();setTimeout(()=>{pickVoice();if(S.screen==='voices')rr()},500);return}
   case'guest':S.user={name:'Guest',guest:true};ls.set(KEYS.user,S.user);return reset(P.done?'home':'perms');
   case'forgot':return forgotSheet();
   case'eye':{const i=t.parentElement.querySelector('input'),show=i.type==='password';i.type=show?'text':'password';t.innerHTML=ic(show?'eyeoff':'eye');t.setAttribute('aria-label',show?'Hide password':'Show password');return}
   case'perm-mic':return reqPerm('mic');
   case'perm-cam':return reqPerm('cam');
   case'permnext':S.pz=0;S.pzEdit=false;return reset('pz');
   case'pzback':if(S.pz>0){S.pz--;render('pop')}else if(S.pzEdit)back();else reset('perms');return;
   case'pzskip':P.done=true;savePrefs();return reset('ready');
   case'pznext':if(S.pz<PZ.length-1){S.pz++;render('push')}else{P.done=true;savePrefs();if(S.pzEdit)back();else reset('ready')}return;
   case'readygo':return reset('home');
   case'editpz':S.pz=0;S.pzEdit=true;return go('pz');
   case'hf':if(S.screen==='cook'||S.screen==='tasks'){recWanted?stopRec():startRec();return}
   case'talk':{const ok=startRec();if(!ok)return;S.listenOnce=true;S.handsfree=true;updateBars();
     say(S.screen==='pantry'?'I’m listening. Tell me what you have.':S.screen==='adapt'?'I’m listening. How should I change the recipe?':S.screen==='scan'?'Listening. Say capture when you’re ready.':'I’m listening. What are you craving?');return}
   case'photo':S.photoFor=S.rid;$('#photoin').value='';$('#photoin').click();return;
   case'capture':return capture();
   case'scangesture':S.scanGesture=!S.scanGesture;rr();if(S.scanGesture){runGestures('#camv',{only:'palm',onSignal:()=>{S.scanGesture=false;capture()}});say('Gesture capture on. Hold an open palm still in front of the camera.')}else{stopGestures();say('Gesture capture off.')}return;
   case'retrycam':{const n=$('#nocam');if(n)n.remove();return startScan()}
   case'demo':return demoScan();
   case'adapt':S.adapt=null;go('adapt');startRec();S.listenOnce=true;say('Tell me how you’d like to change this recipe. For example, make it less spicy.');return;
   case'apply':return applyAdapt();
   case'cook':return startCooking();
   case'next':return nextStep();
   case'prev':return prevStep();
   case'gest':return toggleGestures();
   case'gestquick':return gestSheet();
   case'gestfull':closeSheet(true);return go('gesture');
   case'steptimer':{const st=R().steps[S.step];if(st.timer&&!S.timers.find(x=>x.name===st.timer[0]&&!x.fired))startStepTimer(false);return go('tasks')}
   case'finish':return finish();
   case'exitcook':stopStream();S.gestures=false;return back();
   case'gdefault':P.gest=clone(DEF.gest);savePrefs();rr();updateTicks();return;
   case'testvoice':return speak(VOICE_SAMPLE);
   case'clearphotos':PH={};ls.del(KEYS.photos);caption('Recipe photos cleared.','CHEF AI');return;
   case'resetpz':return confirmSheet({title:'Reset preferences?',body:'This clears your diet, allergies, voice, gesture and display settings, signs you out, and restarts from the welcome screens. Your recipe photos and cooking history stay.',ok:'Reset and start over',danger:true,fn:()=>restartAll(false)});
   case'signout':return confirmSheet({title:'Sign out?',body:'Your settings stay on this device.',ok:'Sign out',danger:true,fn:()=>{S.user=null;ls.del(KEYS.user);stopRec();reset('welcome')}});
   case'delete':return confirmSheet({title:'Delete all data?',body:'This removes your account, preferences, photos and cooking history from this device, then restarts from the beginning. It can’t be undone.',ok:'Delete everything',danger:true,fn:()=>restartAll(true)});
   case'saveacct':{const n=$('#name').value.trim(),m=$('#email').value.trim();if(m&&!validate($('#email')))return;
     if(!n){$('#e-name').textContent='Add your name';return}S.user={...(S.user||{}),name:n,email:m||undefined,guest:m?false:(S.user&&S.user.guest)};ls.set(KEYS.user,S.user);caption('Saved.','CHEF AI');return}
   case'sheetok':{const f=S.sheetFn;S.sheetFn=null;closeSheet();setTimeout(()=>f&&f(),240);return}
   case'sheetclose':return closeSheet();
  }
});
$('#photoin').addEventListener('change',e=>{if(e.target.files[0])savePhoto(S.photoFor||S.rid,e.target.files[0])});
$('#scanin').addEventListener('change',e=>{if(e.target.files[0])analyzePhoto(e.target.files[0])});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(S.stream){S.resume=S.screen;stopStream()}}else if(S.resume){const r=S.resume;S.resume=null;if(S.screen===r)resumeCam()}});

/* =============== boot =============== */
applyUI();render('fade');enter('splash');
window.__S=S;
</script>
</body>
